{% extends 'faculty_base.html' %}

{% block content %}

<style>
  /* ============================================================
     PREMIUM TIMETABLE MANAGEMENT STYLES
     Enterprise-grade, fully consistent with the ERP portal
     ============================================================ */

  /* ----- page title (consistent with other headings) ----- */
  .page-title {
    font-size: 2rem;
    font-weight: 700;
    color: #0f172a;
    margin-bottom: 30px;
    letter-spacing: -0.5px;
    position: relative;
    display: inline-block;
  }

  .page-title::after {
    content: '';
    position: absolute;
    bottom: -8px;
    left: 0;
    width: 60px;
    height: 4px;
    background: #2563eb;
    border-radius: 4px;
    transition: width 0.3s ease;
  }

  .page-title:hover::after {
    width: 100%;
  }

  /* ----- card container ----- */
  .card-box {
    background: #ffffff;
    padding: 28px 32px;
    border-radius: 24px;
    box-shadow: 0 8px 32px rgba(15, 23, 42, 0.06);
    border: 1px solid rgba(226, 232, 240, 0.6);
    transition: box-shadow 0.3s ease, transform 0.3s ease;
  }

  .card-box:hover {
    box-shadow: 0 16px 48px rgba(15, 23, 42, 0.08);
    transform: translateY(-2px);
  }

  /* ----- premium table styling (overriding Bootstrap) ----- */
  .table {
    background: #ffffff;
    border-radius: 24px;
    overflow: hidden;
    box-shadow: 0 8px 32px rgba(15, 23, 42, 0.06);
    border: 1px solid rgba(226, 232, 240, 0.6);
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
    margin-top: 16px;
    font-size: 0.95rem;
  }

  /* Remove Bootstrap's default bordered styles */
  .table-bordered {
    border: none;
  }

  .table-bordered th,
  .table-bordered td {
    border: none;
  }

  .table thead {
    background: linear-gradient(145deg, #f1f5f9, #e2e8f0);
    color: #0f172a;
  }

  .table thead th {
    font-weight: 600;
    font-size: 0.9rem;
    text-transform: uppercase;
    letter-spacing: 0.3px;
    color: #475569;
    padding: 18px 20px;
    border-bottom: 2px solid #e2e8f0;
    text-align: left;
    white-space: nowrap;
  }

  /* Override the table-primary class from Bootstrap */
  .table-primary {
    background: linear-gradient(145deg, #f1f5f9, #e2e8f0) !important;
    color: #0f172a;
  }

  .table-primary th {
    background: transparent !important;
  }

  .table tbody td {
    padding: 16px 20px;
    border-bottom: 1px solid #f1f5f9;
    color: #0f172a;
    vertical-align: middle;
  }

  .table tbody tr:last-child td {
    border-bottom: none;
  }

  /* hover effect */
  .table-hover tbody tr {
    transition: background 0.2s ease;
  }

  .table-hover tbody tr:hover {
    background: #f8fafc;
  }

  /* subtle zebra striping for better readability */
  .table tbody tr:nth-of-type(even) {
    background: #fafbfc;
  }

  .table-hover tbody tr:nth-of-type(even):hover {
    background: #f1f5f9;
  }

  /* ----- form controls inside table (input fields) ----- */
  .form-control {
    border-radius: 12px;
    padding: 10px 14px;
    border: 1px solid #e2e8f0;
    background: #ffffff;
    color: #0f172a;
    font-size: 0.95rem;
    transition: all 0.3s ease;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
    width: 100%;
    min-width: 120px;
  }

  .form-control:focus {
    outline: none;
    border-color: #2563eb;
    box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12), 0 4px 12px rgba(37, 99, 235, 0.08);
    background: #ffffff;
  }

  /* ----- premium save button (matches .btn-success) ----- */
  .btn-save {
    background: #10b981;
    color: white;
    border: none;
    padding: 8px 20px;
    border-radius: 50px;
    font-weight: 600;
    font-size: 0.9rem;
    letter-spacing: 0.3px;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 8px 24px rgba(16, 185, 129, 0.25);
    cursor: pointer;
  }

  .btn-save:hover {
    background: #059669;
    transform: translateY(-3px);
    box-shadow: 0 12px 36px rgba(16, 185, 129, 0.40);
    color: white;
  }

  .btn-save:active {
    transform: scale(0.96);
  }

  /* ----- responsive adjustments ----- */
  @media (max-width: 768px) {
    .page-title {
      font-size: 1.6rem;
    }

    .card-box {
      padding: 20px 16px;
      border-radius: 18px;
    }

    .table {
      font-size: 0.85rem;
      border-radius: 16px;
    }

    .table thead th,
    .table tbody td {
      padding: 12px 14px;
    }

    .form-control {
      padding: 8px 10px;
      font-size: 0.85rem;
      min-width: 80px;
    }

    .btn-save {
      padding: 6px 14px;
      font-size: 0.8rem;
    }
  }

  @media (max-width: 480px) {
    .table thead th {
      font-size: 0.7rem;
      padding: 8px 8px;
      white-space: normal;
    }

    .table tbody td {
      padding: 8px 8px;
      font-size: 0.8rem;
    }

    .form-control {
      padding: 6px 8px;
      font-size: 0.8rem;
      min-width: 60px;
    }

    /* make table horizontally scrollable */
    .table {
      display: block;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    .table thead,
    .table tbody,
    .table tr {
      display: table;
      width: 100%;
      table-layout: fixed;
    }
  }

  /* ensure base container doesn't interfere */
  .table * {
    box-sizing: border-box;
  }
</style>

<h2 class="page-title">
  Timetable Management
</h2>

<div class="card-box">

  <table class="table table-bordered table-hover">

    <thead class="table-primary">

      <tr>

        <th>Day</th>
        <th>Period 1</th>
        <th>Period 2</th>
        <th>Period 3</th>
        <th>Period 4</th>
        <th>Period 5</th>
        <th>Action</th>

      </tr>

    </thead>

    <tbody>

      {% for row in data %}

      <form method="POST">

        <tr>

          <td>

            {{ row.Day }}

            <input
            type="hidden"
            name="day"
            value="{{ row.Day }}">

          </td>

          <td>

            <input
            type="text"
            class="form-control"
            name="p1"
            value="{{ row.P1 }}">

          </td>

          <td>

            <input
            type="text"
            class="form-control"
            name="p2"
            value="{{ row.P2 }}">

          </td>

          <td>

            <input
            type="text"
            class="form-control"
            name="p3"
            value="{{ row.P3 }}">

          </td>

          <td>

            <input
            type="text"
            class="form-control"
            name="p4"
            value="{{ row.P4 }}">

          </td>

          <td>

            <input
            type="text"
            class="form-control"
            name="p5"
            value="{{ row.P5 }}">

          </td>

          <td>

            <button
            type="submit"
            class="btn-save">

            Save

          </button>

        </td>

      </tr>

    </form>

    {% endfor %}

  </tbody>

</table>

</div>

{% endblock %}
