{% extends 'base.html' %}

{% block title %}
Fee Details
{% endblock %}

{% block content %}

<style>
  /* ============================================================
     PREMIUM FEE DETAILS TABLE STYLES
     Enterprise-grade design, fully consistent with the ERP portal
     ============================================================ */

  /* ----- page heading (matches other content headings) ----- */
  .content h2 {
    color: #0f172a;
    margin-bottom: 30px;
    font-size: 2rem;
    font-weight: 700;
    letter-spacing: -0.5px;
    position: relative;
    display: inline-block;
  }

  .content h2::after {
    content: '';
    position: absolute;
    bottom: -8px;
    left: 0;
    width: 60px;
    height: 4px;
    background: #2563eb;
    border-radius: 4px;
    transition: width 0.3s ease;
  }

  .content h2:hover::after {
    width: 100%;
  }

  /* ----- premium table styling (overriding Bootstrap) ----- */
  .table {
    background: #ffffff;
    border-radius: 24px;
    overflow: hidden;
    box-shadow: 0 8px 32px rgba(15, 23, 42, 0.06);
    border: 1px solid rgba(226, 232, 240, 0.6);
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
    margin-top: 16px;
    font-size: 0.95rem;
  }

  /* Remove Bootstrap's default bordered styles */
  .table-bordered {
    border: none;
  }

  .table-bordered th,
  .table-bordered td {
    border: none;
  }

  .table thead {
    background: linear-gradient(145deg, #f1f5f9, #e2e8f0);
    color: #0f172a;
  }

  .table thead th {
    font-weight: 600;
    font-size: 0.9rem;
    text-transform: uppercase;
    letter-spacing: 0.3px;
    color: #475569;
    padding: 18px 20px;
    border-bottom: 2px solid #e2e8f0;
    text-align: left;
    white-space: nowrap;
  }

  .table tbody td {
    padding: 16px 20px;
    border-bottom: 1px solid #f1f5f9;
    color: #0f172a;
    vertical-align: middle;
  }

  .table tbody tr:last-child td {
    border-bottom: none;
  }

  /* hover effect */
  .table tbody tr {
    transition: background 0.2s ease;
  }

  .table tbody tr:hover {
    background: #f8fafc;
  }

  /* subtle zebra striping for better readability */
  .table tbody tr:nth-of-type(even) {
    background: #fafbfc;
  }

  .table tbody tr:nth-of-type(even):hover {
    background: #f1f5f9;
  }

  /* ----- responsive adjustments ----- */
  @media (max-width: 768px) {
    .content h2 {
      font-size: 1.6rem;
    }

    .table {
      font-size: 0.85rem;
      border-radius: 16px;
    }

    .table thead th,
    .table tbody td {
      padding: 12px 14px;
    }
  }

  @media (max-width: 480px) {
    .table thead th {
      font-size: 0.75rem;
      padding: 10px 12px;
      white-space: normal;
    }

    .table tbody td {
      padding: 10px 12px;
      font-size: 0.8rem;
    }

    /* make table horizontally scrollable on tiny screens */
    .table {
      display: block;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
  }

  /* ensure base container doesn't interfere */
  .table * {
    box-sizing: border-box;
  }
</style>

<h2>Fee Details</h2>

<table class="table table-bordered">

<thead>
<tr>

{% for col in data[0].keys() %}
<th>{{ col }}</th>
{% endfor %}

</tr>
</thead>

<tbody>

{% for row in data %}

<tr>

{% for value in row.values() %}
<td>{{ value }}</td>
{% endfor %}

</tr>

{% endfor %}

</tbody>

</table>

{% endblock %}
