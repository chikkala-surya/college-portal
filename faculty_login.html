<!DOCTYPE html>
<html>

<head>
  <title>Faculty Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    /* ============================================================
       PREMIUM FACULTY LOGIN – ENTERPRISE-GRADE STYLING
       Consistent with the rest of the ERP portal
       ============================================================ */

    /* ----- reset & base ----- */
    * {
      font-family: 'Poppins', 'Segoe UI', system-ui, sans-serif;
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(145deg, #0f172a 0%, #1e293b 60%, #2563eb 100%);
      position: relative;
      overflow: hidden;
    }

    /* subtle animated background glow */
    body::before {
      content: '';
      position: absolute;
      top: -50%;
      right: -30%;
      width: 80%;
      height: 200%;
      background: radial-gradient(circle, rgba(37, 99, 235, 0.15) 0%, transparent 70%);
      pointer-events: none;
      animation: pulseGlow 8s ease-in-out infinite alternate;
    }

    @keyframes pulseGlow {
      0% {
        transform: scale(1) rotate(0deg);
        opacity: 0.6;
      }
      100% {
        transform: scale(1.2) rotate(10deg);
        opacity: 1;
      }
    }

    /* ----- login card (glassmorphism) ----- */
    .login-card {
      width: 440px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 42px 38px;
      border-radius: 32px;
      box-shadow: 0 30px 80px rgba(15, 23, 42, 0.25), 0 10px 30px rgba(0, 0, 0, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.4);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      position: relative;
      z-index: 2;
    }

    .login-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 40px 100px rgba(37, 99, 235, 0.20), 0 10px 30px rgba(0, 0, 0, 0.06);
    }

    /* ----- titles ----- */
    .login-title {
      text-align: center;
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
      color: #0f172a;
    }

    .login-sub {
      text-align: center;
      margin-bottom: 30px;
      color: #64748b;
      font-weight: 400;
      font-size: 0.95rem;
      letter-spacing: 0.3px;
    }

    /* ----- form controls ----- */
    .form-control {
      border-radius: 16px;
      padding: 14px 18px;
      margin-bottom: 18px;
      border: 1px solid #e2e8f0;
      background: #ffffff;
      color: #0f172a;
      font-size: 0.95rem;
      transition: all 0.3s ease;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
    }

    .form-control:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12), 0 4px 12px rgba(37, 99, 235, 0.08);
      background: #ffffff;
    }

    .form-control::placeholder {
      color: #94a3b8;
      font-weight: 400;
    }

    /* ----- login button (premium) ----- */
    .btn-login {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 50px;
      background: linear-gradient(145deg, #2563eb, #1e40af);
      color: white;
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: 0.3px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 8px 24px rgba(37, 99, 235, 0.30);
      cursor: pointer;
    }

    .btn-login:hover {
      transform: translateY(-3px);
      box-shadow: 0 14px 36px rgba(37, 99, 235, 0.45);
      background: linear-gradient(145deg, #1d4ed8, #1e3a8a);
    }

    .btn-login:active {
      transform: scale(0.97);
    }

    /* ----- alert (error message) ----- */
    .alert {
      border-radius: 16px;
      padding: 14px 20px;
      margin-top: 18px;
      border: none;
      font-weight: 500;
      font-size: 0.9rem;
      background: rgba(239, 68, 68, 0.08);
      color: #dc2626;
      border-left: 4px solid #ef4444;
      box-shadow: 0 4px 12px rgba(239, 68, 68, 0.06);
    }

    .alert-danger {
      background: rgba(239, 68, 68, 0.08);
      color: #dc2626;
    }

    /* ----- responsive fine-tuning ----- */
    @media (max-width: 480px) {
      .login-card {
        width: 92%;
        padding: 32px 24px;
        border-radius: 24px;
      }

      .login-title {
        font-size: 1.6rem;
      }

      .form-control {
        padding: 12px 16px;
        font-size: 0.9rem;
      }

      .btn-login {
        padding: 12px;
        font-size: 0.95rem;
      }
    }

    /* ----- scrollbar (global) ----- */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
  </style>
</head>

<body>

  <div class="login-card">

    <div class="login-title">
      👨‍🏫 Faculty Login
    </div>

    <div class="login-sub">
      Faculty Management Portal
    </div>

    <form method="POST">

      <input type="text" name="faculty_id" class="form-control" placeholder="Faculty ID" required>

      <input type="password" name="password" class="form-control" placeholder="Password" required>

      <button type="submit" class="btn-login">
        Login
      </button>

    </form>

    {% if error %}

    <div class="alert alert-danger mt-3">
      {{ error }}
    </div>

    {% endif %}

  </div>

</body>

</html>
