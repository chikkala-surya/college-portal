{% extends 'base.html' %}

{% block title %}
Dashboard
{% endblock %}

{% block content %}

<style>
  /* ============================================================
     PREMIUM STUDENT DASHBOARD STYLES
     Fully consistent with the ERP portal's enterprise-grade design
     ============================================================ */

  /* ----- page heading (matches other content headings) ----- */
  .content h2 {
    color: #0f172a;
    margin-bottom: 30px;
    font-size: 2rem;
    font-weight: 700;
    letter-spacing: -0.5px;
    position: relative;
    display: inline-block;
  }

  .content h2::after {
    content: '';
    position: absolute;
    bottom: -8px;
    left: 0;
    width: 60px;
    height: 4px;
    background: #2563eb;
    border-radius: 4px;
    transition: width 0.3s ease;
  }

  .content h2:hover::after {
    width: 100%;
  }

  /* ----- dashboard cards grid ----- */
  .dashboard-cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 24px;
    margin-top: 10px;
  }

  /* ----- individual info card ----- */
  .info-card {
    background: #ffffff;
    padding: 28px 24px;
    border-radius: 24px;
    box-shadow: 0 8px 32px rgba(15, 23, 42, 0.06);
    border: 1px solid rgba(226, 232, 240, 0.6);
    transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
    overflow: hidden;
    text-align: left;
  }

  .info-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 4px;
    background: linear-gradient(90deg, #2563eb, #60a5fa);
    opacity: 0;
    transition: opacity 0.3s ease;
  }

  .info-card:hover {
    transform: translateY(-8px);
    box-shadow: 0 24px 60px rgba(15, 23, 42, 0.10);
    border-color: rgba(37, 99, 235, 0.2);
  }

  .info-card:hover::before {
    opacity: 1;
  }

  .info-card h4 {
    font-size: 0.85rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: #64748b;
    margin-bottom: 10px;
  }

  .info-card p {
    font-size: 1.5rem;
    font-weight: 700;
    color: #0f172a;
    margin: 0;
    line-height: 1.3;
    word-break: break-word;
  }

  /* ----- responsive adjustments ----- */
  @media (max-width: 768px) {
    .dashboard-cards {
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .info-card {
      padding: 22px 18px;
    }

    .info-card p {
      font-size: 1.3rem;
    }
  }

  @media (max-width: 480px) {
    .dashboard-cards {
      grid-template-columns: 1fr;
      gap: 14px;
    }

    .content h2 {
      font-size: 1.6rem;
    }
  }

  /* ----- ensure base container doesn't interfere ----- */
  .dashboard-cards * {
    box-sizing: border-box;
  }
</style>

<h2>Student Dashboard</h2>

<div class="dashboard-cards">

  <div class="info-card">
    <h4>Name</h4>
    <p>{{ profile.Name }}</p>
  </div>

  <div class="info-card">
    <h4>Roll No</h4>
    <p>{{ profile.RollNo }}</p>
  </div>

  <div class="info-card">
    <h4>Branch</h4>
    <p>{{ profile.Branch }}</p>
  </div>

  <div class="info-card">
    <h4>Section</h4>
    <p>{{ profile.Section }}</p>
  </div>

</div>

{% endblock %}
