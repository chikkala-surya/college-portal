<!DOCTYPE html>
<html>

<head>
  <title>College ERP</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    /* ============================================================
       PREMIUM LANDING PAGE – ENTERPRISE-GRADE STYLING
       Consistent with the entire ERP portal (login, dashboard, etc.)
       ============================================================ */

    * {
      font-family: 'Poppins', 'Segoe UI', system-ui, sans-serif;
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(145deg, #0f172a 0%, #1e293b 60%, #2563eb 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
    }

    /* subtle animated background glow */
    body::before {
      content: '';
      position: absolute;
      top: -30%;
      right: -20%;
      width: 80%;
      height: 150%;
      background: radial-gradient(circle, rgba(37, 99, 235, 0.15) 0%, transparent 70%);
      pointer-events: none;
      animation: pulseGlow 10s ease-in-out infinite alternate;
    }

    @keyframes pulseGlow {
      0% {
        transform: scale(1) rotate(0deg);
        opacity: 0.5;
      }
      100% {
        transform: scale(1.2) rotate(8deg);
        opacity: 1;
      }
    }

    /* ----- hero container ----- */
    .hero {
      width: 90%;
      max-width: 1200px;
      text-align: center;
      color: white;
      padding: 20px;
      position: relative;
      z-index: 2;
    }

    /* ----- main title ----- */
    .hero h1 {
      font-size: 4.2rem;
      font-weight: 800;
      letter-spacing: -1px;
      margin-bottom: 12px;
      background: linear-gradient(to right, #ffffff, #93c5fd);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .hero p {
      font-size: 1.3rem;
      font-weight: 300;
      opacity: 0.9;
      margin-bottom: 50px;
      color: rgba(255, 255, 255, 0.85);
      letter-spacing: 0.3px;
    }

    /* ----- features grid ----- */
    .features {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 24px;
      margin-bottom: 50px;
    }

    .feature-card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 30px 20px;
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
    }

    .feature-card:hover {
      transform: translateY(-8px);
      background: rgba(255, 255, 255, 0.14);
      border-color: rgba(255, 255, 255, 0.25);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
    }

    .feature-card i {
      font-size: 2.6rem;
      margin-bottom: 14px;
      color: #60a5fa;
      display: block;
      transition: transform 0.3s ease;
    }

    .feature-card:hover i {
      transform: scale(1.1);
    }

    .feature-card h5 {
      font-weight: 600;
      font-size: 1.1rem;
      letter-spacing: 0.3px;
      margin: 0;
      color: #ffffff;
    }

    /* ----- custom buttons (premium) ----- */
    .btn-custom {
      padding: 16px 42px;
      border-radius: 50px;
      font-weight: 700;
      font-size: 1.05rem;
      letter-spacing: 0.3px;
      margin: 10px 14px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      text-decoration: none;
      display: inline-block;
      border: none;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
    }

    .student-btn {
      background: #2563eb;
      color: white;
      box-shadow: 0 12px 40px rgba(37, 99, 235, 0.35);
    }

    .student-btn:hover {
      transform: translateY(-4px);
      background: #1d4ed8;
      box-shadow: 0 20px 56px rgba(37, 99, 235, 0.50);
    }

    .faculty-btn {
      background: #10b981;
      color: white;
      box-shadow: 0 12px 40px rgba(16, 185, 129, 0.35);
    }

    .faculty-btn:hover {
      transform: translateY(-4px);
      background: #059669;
      box-shadow: 0 20px 56px rgba(16, 185, 129, 0.50);
    }

    .btn-custom:active {
      transform: scale(0.96);
    }

    /* ----- responsive fine-tuning ----- */
    @media (max-width: 992px) {
      .features {
        grid-template-columns: repeat(2, 1fr);
        gap: 20px;
      }
    }

    @media (max-width: 768px) {
      .hero h1 {
        font-size: 2.8rem;
      }

      .hero p {
        font-size: 1.1rem;
        margin-bottom: 35px;
      }

      .features {
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }

      .feature-card {
        padding: 22px 16px;
      }

      .feature-card i {
        font-size: 2rem;
      }

      .btn-custom {
        padding: 14px 28px;
        font-size: 0.95rem;
        margin: 8px 10px;
      }
    }

    @media (max-width: 480px) {
      .features {
        grid-template-columns: 1fr;
        gap: 14px;
      }

      .hero h1 {
        font-size: 2.2rem;
      }

      .btn-custom {
        display: block;
        width: 100%;
        margin: 10px 0;
      }
    }

    /* ----- scrollbar (global) ----- */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
  </style>
</head>

<body>

  <div class="hero">

    <h1>
      🎓 College ERP System
    </h1>

    <p>
      Student Information & Faculty Management Portal
    </p>

    <div class="features">

      <div class="feature-card">

        <i class="fas fa-user-graduate"></i>

        <h5>Students</h5>

      </div>

      <div class="feature-card">

        <i class="fas fa-calendar-check"></i>

        <h5>Attendance</h5>

      </div>

      <div class="feature-card">

        <i class="fas fa-book"></i>

        <h5>Academics</h5>

      </div>

      <div class="feature-card">

        <i class="fas fa-briefcase"></i>

        <h5>Placements</h5>

      </div>

    </div>

    <a href="/login" class="btn btn-custom student-btn">

      Student Login

    </a>

    <a href="/faculty-login" class="btn btn-custom faculty-btn">

      Faculty Login

    </a>

  </div>

</body>

</html>
