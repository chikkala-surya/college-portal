<!DOCTYPE html>

<html>

<head>

<title>Student Portal</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap"
rel="stylesheet">

<style>
  /* ============================================================
     PREMIUM STUDENT PORTAL – ENTERPRISE-GRADE STYLING
     Modern, clean, premium university ERP experience
     ============================================================ */

  /* ----- reset & base ----- */
  * {
    font-family: 'Poppins', 'Segoe UI', system-ui, -apple-system, sans-serif;
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background: #f8fafc;
    color: #0f172a;
    transition: background 0.3s ease;
    line-height: 1.6;
  }

  /* ----- premium sidebar ----- */
  .sidebar {
    position: fixed;
    width: 280px;
    height: 100vh;
    background: #1e293b;
    left: 0;
    top: 0;
    overflow-y: auto;
    box-shadow: 4px 0 24px rgba(0, 0, 0, 0.12);
    z-index: 1000;
    transition: width 0.3s ease;
  }

  .sidebar::-webkit-scrollbar {
    width: 4px;
  }

  .sidebar::-webkit-scrollbar-track {
    background: rgba(255, 255, 255, 0.05);
  }

  .sidebar::-webkit-scrollbar-thumb {
    background: #475569;
    border-radius: 10px;
  }

  .sidebar::-webkit-scrollbar-thumb:hover {
    background: #64748b;
  }

  /* ----- logo area ----- */
  .logo {
    padding: 32px 24px;
    text-align: center;
    color: #ffffff;
    font-size: 1.4rem;
    font-weight: 800;
    letter-spacing: -0.5px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    background: rgba(255, 255, 255, 0.02);
    position: relative;
  }

  .logo span {
    color: #60a5fa;
  }

  /* ----- sidebar links ----- */
  .sidebar a {
    display: block;
    padding: 14px 28px;
    color: #cbd5e1;
    text-decoration: none;
    font-weight: 500;
    font-size: 0.95rem;
    border-left: 4px solid transparent;
    margin: 4px 12px;
    border-radius: 12px;
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .sidebar a:hover {
    background: rgba(255, 255, 255, 0.06);
    color: #ffffff;
    border-left-color: #2563eb;
    padding-left: 32px;
    transform: translateX(4px);
  }

  /* active state (if dynamically added) */
  .sidebar a.active {
    background: rgba(37, 99, 235, 0.15);
    color: #ffffff;
    border-left-color: #2563eb;
    font-weight: 600;
    box-shadow: 0 4px 16px rgba(37, 99, 235, 0.15);
  }

  /* ----- main content area ----- */
  .main {
    margin-left: 280px;
    padding: 32px 40px;
    min-height: 100vh;
    background: #f8fafc;
  }

  /* ----- topbar (dashboard header) ----- */
  .topbar {
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    padding: 20px 28px;
    border-radius: 24px;
    box-shadow: 0 8px 32px rgba(15, 23, 42, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.6);
    margin-bottom: 32px;
    transition: box-shadow 0.3s ease, transform 0.3s ease;
  }

  .topbar:hover {
    box-shadow: 0 12px 40px rgba(15, 23, 42, 0.08);
    transform: translateY(-2px);
  }

  .topbar h4 {
    font-weight: 700;
    font-size: 1.4rem;
    color: #0f172a;
    letter-spacing: -0.3px;
    margin: 0;
  }

  /* ----- scrollbar (global) ----- */
  ::-webkit-scrollbar {
    width: 8px;
    height: 8px;
  }

  ::-webkit-scrollbar-track {
    background: #f1f5f9;
    border-radius: 10px;
  }

  ::-webkit-scrollbar-thumb {
    background: #cbd5e1;
    border-radius: 10px;
    transition: background 0.2s ease;
  }

  ::-webkit-scrollbar-thumb:hover {
    background: #94a3b8;
  }

  /* ----- responsive fine-tuning ----- */
  @media (max-width: 768px) {
    .sidebar {
      width: 100%;
      height: auto;
      position: relative;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .main {
      margin-left: 0;
      padding: 20px 16px;
    }

    .topbar {
      padding: 16px 20px;
      border-radius: 18px;
    }

    .topbar h4 {
      font-size: 1.2rem;
    }

    .sidebar a {
      padding: 12px 20px;
      margin: 2px 8px;
      font-size: 0.9rem;
    }

    .logo {
      padding: 24px 16px;
      font-size: 1.2rem;
    }
  }

  /* ----- extra polish for child content (cards, etc.) ----- */
  .main .container,
  .main .row {
    margin-top: 0;
  }

  .main .card {
    border-radius: 24px;
    border: 1px solid rgba(226, 232, 240, 0.5);
    box-shadow: 0 8px 32px rgba(15, 23, 42, 0.06);
    transition: box-shadow 0.3s ease, transform 0.3s ease;
  }

  .main .card:hover {
    box-shadow: 0 16px 48px rgba(15, 23, 42, 0.08);
    transform: translateY(-2px);
  }
</style>

</head>

<body>

<div class="sidebar">

<div class="logo">
🎓 Student Portal
</div>

<a href="/dashboard">Dashboard</a>

<a href="/profile">Profile</a>

<a href="/attendance">Attendance</a>

<a href="/internal">Internal Marks</a>

<a href="/external">External Marks</a>

<a href="/semester">Semester Results</a>

<a href="/fees">Fees</a>

<a href="/timetable">Timetable</a>

<a href="/backlog">Backlogs</a>

<a href="/idcard">ID Card</a>

<a href="/logout">Logout</a>

</div>

<div class="main">

<div class="topbar">

<h4>
Student Dashboard
</h4>

</div>

{% block content %}
{% endblock %}

</div>

</body>

</html>
