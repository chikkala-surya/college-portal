<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>College ERP</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    /* ============================================================
       PREMIUM FACULTY ERP – ENTERPRISE-GRADE STYLING
       Consistent with Student Portal & Faculty Dashboard designs
       ============================================================ */

    /* ----- reset & base ----- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', 'Segoe UI', system-ui, sans-serif;
    }

    body {
      background: #f8fafc;
      color: #0f172a;
      transition: background 0.3s ease;
      line-height: 1.6;
    }

    /* ----- premium sidebar ----- */
    .sidebar {
      position: fixed;
      left: 0;
      top: 0;
      width: 280px;
      height: 100vh;
      background: #1e293b;
      overflow-y: auto;
      box-shadow: 4px 0 24px rgba(0, 0, 0, 0.12);
      z-index: 1000;
      transition: width 0.3s ease;
    }

    .sidebar::-webkit-scrollbar {
      width: 4px;
    }
    .sidebar::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.05);
    }
    .sidebar::-webkit-scrollbar-thumb {
      background: #475569;
      border-radius: 10px;
    }
    .sidebar::-webkit-scrollbar-thumb:hover {
      background: #64748b;
    }

    /* ----- logo area ----- */
    .logo {
      padding: 32px 24px;
      text-align: center;
      color: #ffffff;
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      background: rgba(255, 255, 255, 0.02);
      position: relative;
    }

    .logo span {
      color: #60a5fa;
    }

    /* ----- sidebar links (with icons) ----- */
    .sidebar a {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 28px;
      color: #cbd5e1;
      text-decoration: none;
      font-weight: 500;
      font-size: 0.95rem;
      border-left: 4px solid transparent;
      margin: 4px 12px;
      border-radius: 12px;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .sidebar a i {
      width: 22px;
      font-size: 1.1rem;
      text-align: center;
      flex-shrink: 0;
    }

    .sidebar a:hover {
      background: rgba(255, 255, 255, 0.06);
      color: #ffffff;
      border-left-color: #2563eb;
      padding-left: 32px;
      transform: translateX(4px);
    }

    .sidebar a.active {
      background: rgba(37, 99, 235, 0.15);
      color: #ffffff;
      border-left-color: #2563eb;
      font-weight: 600;
      box-shadow: 0 4px 16px rgba(37, 99, 235, 0.15);
    }

    /* ----- main content area ----- */
    .main {
      margin-left: 280px;
      padding: 32px 40px;
      min-height: 100vh;
      background: #f8fafc;
    }

    /* ----- topbar (dashboard header) ----- */
    .topbar {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 18px 28px;
      border-radius: 24px;
      box-shadow: 0 8px 32px rgba(15, 23, 42, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.6);
      margin-bottom: 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: box-shadow 0.3s ease, transform 0.3s ease;
    }

    .topbar:hover {
      box-shadow: 0 12px 40px rgba(15, 23, 42, 0.08);
      transform: translateY(-2px);
    }

    .erp-title {
      font-size: 1.4rem;
      font-weight: 700;
      color: #0f172a;
      letter-spacing: -0.3px;
      margin: 0;
    }

    .profile-box {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: linear-gradient(145deg, #2563eb, #1e40af);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 700;
      font-size: 1.1rem;
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.25);
    }

    .profile-box b {
      color: #0f172a;
      font-weight: 600;
    }
    .profile-box small {
      color: #64748b;
      font-weight: 400;
    }

    /* ----- cards (Bootstrap override) ----- */
    .card {
      border: none;
      border-radius: 24px;
      box-shadow: 0 8px 32px rgba(15, 23, 42, 0.06);
      transition: box-shadow 0.3s ease, transform 0.3s ease;
    }

    .card:hover {
      box-shadow: 0 16px 48px rgba(15, 23, 42, 0.08);
      transform: translateY(-4px);
    }

    /* ----- table container (and table) ----- */
    .table-container {
      background: #ffffff;
      padding: 24px;
      border-radius: 24px;
      box-shadow: 0 8px 32px rgba(15, 23, 42, 0.06);
      border: 1px solid rgba(226, 232, 240, 0.5);
      transition: box-shadow 0.3s ease;
      overflow: hidden;
    }

    .table-container:hover {
      box-shadow: 0 12px 40px rgba(15, 23, 42, 0.08);
    }

    .table {
      margin-bottom: 0;
      border-collapse: separate;
      border-spacing: 0;
    }

    .table thead {
      background: #f1f5f9;
      color: #0f172a;
    }

    .table thead th {
      font-weight: 600;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      color: #475569;
      padding: 16px 18px;
      border-bottom: 2px solid #e2e8f0;
      text-align: left;
    }

    .table tbody td {
      padding: 14px 18px;
      border-bottom: 1px solid #f1f5f9;
      color: #0f172a;
      vertical-align: middle;
    }

    .table tbody tr:last-child td {
      border-bottom: none;
    }

    .table tbody tr:hover {
      background: #f8fafc;
    }

    /* ----- buttons (Bootstrap override) ----- */
    .btn {
      font-weight: 600;
      font-size: 0.9rem;
      padding: 10px 24px;
      border-radius: 50px;
      letter-spacing: 0.3px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
      border: none;
    }

    .btn-primary {
      background: #2563eb;
      color: #fff;
      box-shadow: 0 8px 24px rgba(37, 99, 235, 0.30);
    }
    .btn-primary:hover {
      background: #1d4ed8;
      transform: translateY(-3px);
      box-shadow: 0 12px 36px rgba(37, 99, 235, 0.40);
    }

    .btn-success {
      background: #10b981;
      color: #fff;
      box-shadow: 0 8px 24px rgba(16, 185, 129, 0.30);
    }
    .btn-success:hover {
      background: #059669;
      transform: translateY(-3px);
      box-shadow: 0 12px 36px rgba(16, 185, 129, 0.40);
    }

    .btn-danger {
      background: #ef4444;
      color: #fff;
      box-shadow: 0 8px 24px rgba(239, 68, 68, 0.30);
    }
    .btn-danger:hover {
      background: #dc2626;
      transform: translateY(-3px);
      box-shadow: 0 12px 36px rgba(239, 68, 68, 0.40);
    }

    .btn:active {
      transform: scale(0.96);
    }

    /* ----- page title ----- */
    .page-title {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 24px;
      color: #0f172a;
      letter-spacing: -0.5px;
      position: relative;
      display: inline-block;
    }

    .page-title::after {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 0;
      width: 60px;
      height: 4px;
      background: #2563eb;
      border-radius: 4px;
    }

    /* ----- scrollbar (global) ----- */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 10px;
      transition: background 0.2s ease;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    /* ----- responsive fine-tuning ----- */
    @media (max-width: 768px) {
      .sidebar {
        width: 100%;
        height: auto;
        position: relative;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      }

      .main {
        margin-left: 0;
        padding: 20px 16px;
      }

      .topbar {
        padding: 16px 20px;
        border-radius: 18px;
        flex-wrap: wrap;
        gap: 12px;
      }

      .erp-title {
        font-size: 1.2rem;
      }

      .sidebar a {
        padding: 12px 20px;
        margin: 2px 8px;
        font-size: 0.9rem;
        gap: 12px;
      }

      .logo {
        padding: 24px 16px;
        font-size: 1.2rem;
      }

      .page-title {
        font-size: 1.6rem;
      }

      .table-container {
        padding: 16px;
        border-radius: 18px;
      }

      .table thead th,
      .table tbody td {
        padding: 12px 14px;
        font-size: 0.85rem;
      }
    }
  </style>

</head>

<body>

  <div class="sidebar">

    <div class="logo">
      🎓 College ERP
    </div>

    <a href="/faculty-dashboard">
      <i class="fas fa-chart-line"></i>
      Dashboard
    </a>

    <a href="/manage-students">
      <i class="fas fa-user-graduate"></i>
      Students
    </a>

    <a href="/add-student">
      <i class="fas fa-user-plus"></i>
      Add Student
    </a>

    <a href="/manage-attendance">
      <i class="fas fa-calendar-check"></i>
      Attendance
    </a>

    <a href="/manage-internal">
      <i class="fas fa-file-alt"></i>
      Internal Marks
    </a>

    <a href="/manage-external">
      <i class="fas fa-file-signature"></i>
      External Marks
    </a>

    <a href="/manage-fees">
      <i class="fas fa-money-bill-wave"></i>
      Fees
    </a>

    <a href="/manage-semester">
      <i class="fas fa-graduation-cap"></i>
      Semester Results
    </a>

    <a href="/manage-timetable">
      <i class="fas fa-clock"></i>
      Timetable
    </a>

    <a href="/manage-events">
      <i class="fas fa-calendar-star"></i>
      Events
    </a>

    <a href="/manage-library">
      <i class="fas fa-book"></i>
      Library
    </a>

    <a href="/manage-placements">
      <i class="fas fa-briefcase"></i>
      Placements
    </a>

    <a href="/faculty-logout">
      <i class="fas fa-sign-out-alt"></i>
      Logout
    </a>

  </div>

  <div class="main">

    <div class="topbar">

      <div class="erp-title">
        Faculty Management Portal
      </div>

      <div class="profile-box">

        <div class="avatar">
          F
        </div>

        <div>

          <b>Faculty</b><br>

          <small>Administrator</small>

        </div>

      </div>

    </div>

    {% block content %}
    {% endblock %}

  </div>

</body>

</html>
